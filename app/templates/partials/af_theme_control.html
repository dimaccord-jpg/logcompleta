<div class="af-theme-control-row">
    <label class="af-theme-control" for="af-theme-select-{{ af_theme_variant }}">
        <span class="af-theme-control-label">Tema</span>
        <select id="af-theme-select-{{ af_theme_variant }}" data-af-theme-select aria-label="Tema da interface">
            <option value="system" title="Usar preferência do sistema">Sistema</option>
            <option value="dark" selected>Escuro</option>
            <option value="light">Claro</option>
        </select>
    </label>
</div>
