{% if facebook_pixel_id %}
<script>
(() => {
    const completeRegistrationEnabled = {{ (pixel_event_complete_registration or false)|tojson }};
    const leadEnabled = {{ (pixel_event_lead or false)|tojson }};
    const subscribeEvent = {{ (pixel_subscribe_event or {})|tojson }};

    function hasFbq() {
        return typeof window.fbq === "function";
    }

    function getStorageSafe() {
        try {
            if (typeof window.localStorage !== "undefined") {
                return window.localStorage;
            }
        } catch (err) {
            return null;
        }
        return null;
    }

    function trackEvent(eventName, params) {
        if (!eventName || !hasFbq()) {
            return false;
        }
        try {
            if (params && typeof params === "object" && Object.keys(params).length > 0) {
                window.fbq("track", eventName, params);
            } else {
                window.fbq("track", eventName);
            }
            return true;
        } catch (err) {
            return false;
        }
    }

    function trackCustomEvent(eventName, params) {
        if (!eventName || !hasFbq()) {
            return false;
        }
        try {
            if (params && typeof params === "object" && Object.keys(params).length > 0) {
                window.fbq("trackCustom", eventName, params);
            } else {
                window.fbq("trackCustom", eventName);
            }
            return true;
        } catch (err) {
            return false;
        }
    }

    function trackFunnelEvent(funnelEvent, params) {
        try {
            if (!funnelEvent || typeof funnelEvent !== "object") {
                return false;
            }
            if (funnelEvent.allow_meta_pixel !== true) {
                return false;
            }
            if (funnelEvent.event_name === "file_uploaded") {
                return trackCustomEvent("AuditStarted", params);
            }
            if (
                funnelEvent.event_name === "freight_calculated" &&
                funnelEvent.is_first_audit === true
            ) {
                return trackCustomEvent("FirstAuditCompleted", params);
            }
            return false;
        } catch (err) {
            return false;
        }
    }

    function trackEventOnceBySessionId(eventName, sessionId, params) {
        const normalizedEvent = (eventName || "").trim();
        const normalizedSession = (sessionId || "").trim();
        if (!normalizedEvent || !normalizedSession) {
            return false;
        }

        const storageKey = "fb_pixel_" + normalizedEvent.toLowerCase() + "_sent_" + normalizedSession;
        const storage = getStorageSafe();

        if (storage) {
            try {
                if (storage.getItem(storageKey) === "1") {
                    return false;
                }
            } catch (err) {
                // Storage indisponível: segue sem anti-duplicidade persistente.
            }
        }

        const sent = trackEvent(normalizedEvent, params);
        if (!sent) {
            return false;
        }

        if (storage) {
            try {
                storage.setItem(storageKey, "1");
            } catch (err) {
                // Sem storage disponível, mantém execução sem quebra.
            }
        }
        return true;
    }

    window.LogCompletaPixel = {
        hasFbq,
        track: trackEvent,
        trackCustom: trackCustomEvent,
        trackFunnelEvent: trackFunnelEvent,
        trackOnceBySessionId: trackEventOnceBySessionId,
    };

    if (completeRegistrationEnabled) {
        trackEvent("CompleteRegistration");
    }

    if (leadEnabled) {
        trackEvent("Lead");
    }

    if (subscribeEvent && subscribeEvent.session_id) {
        trackEventOnceBySessionId(
            subscribeEvent.event_name || "Purchase",
            subscribeEvent.session_id,
            subscribeEvent.params || null,
        );
    }
})();
</script>
{% endif %}
